stages:
  - build
  - deploy

variables:
  IMAGE_NAME: ghcr.io/$GHCR_USER/fakeobsidian
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: build
  variables:
    DOCKER_BUILDKIT: "1"
  tags:
    - C#
    - fobsi
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
  script:
    - docker pull $IMAGE_NAME:latest || true
    - docker build --cache-from $IMAGE_NAME:latest -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest -f FakeObsidian/Dockerfile .
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  only:
    - master

deploy:
  stage: deploy
  tags:
    - C#
    - fobsi
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
  script:
    - |
      cat > .env <<EOF
      IMAGE_NAME=$IMAGE_NAME
      IMAGE_TAG=$IMAGE_TAG
      ENVIRONMENT=Development
      API_PORT=6784
      DB_NAME=fakeobsidian
      DB_USER=fobsi
      DB_PASSWORD=saeFDHKYTV
      JWT_KEY=$JWT_KEY
      JWT_ISSUER=$JWT_ISSUER
      JWT_AUDIENCE=$JWT_AUDIENCE
      EOF
    - docker compose pull
    - docker compose up -d fakeobsidian.postgres fakeobsidian.redis
    - docker compose run --rm fakeobsidian.migrations
    - docker compose up -d fakeobsidian.api
  only:
    - master